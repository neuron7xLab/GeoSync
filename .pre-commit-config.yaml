# SPDX-License-Identifier: MIT
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.5
    hooks:
      - id: ruff
        args: ["--fix"]
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile=black"]
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.12.0-2
    hooks:
      - id: shfmt
        args: ["-w", "-i", "2", "-ci"]
  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 3.0.0
    hooks:
      - id: shellcheck
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies: [types-requests]
  - repo: local
    hooks:
      - id: slotscheck
        name: slotscheck (core packages)
        entry: python -m slotscheck --module core --module backtest --module execution
        language: python
        additional_dependencies:
          - slotscheck==0.19.1
        pass_filenames: false
      - id: eslint
        name: eslint (dashboard UI)
        entry: npm run lint --prefix ui/dashboard
        language: system
        pass_filenames: false
      - id: central-config-hint
        name: central config sprawl hint
        entry: python scripts/ci/check_config_sprawl.py --staged
        language: python
        pass_filenames: false
      - id: inventory-sync
        name: inventory sync (managed scopes)
        entry: python scripts/ci/check_inventory_sync.py
        language: python
        pass_filenames: false
      - id: manifest-hash-sync
        name: manifest hash verification
        entry: python scripts/ci/check_manifest_hashes.py
        language: python
        pass_filenames: false
      - id: actionlint-local
        name: actionlint (local-or-docker)
        entry: python scripts/ci/run_actionlint.py
        language: python
        pass_filenames: false
      - id: epistemic-drift-check
        name: epistemic drift check
        entry: python scripts/check_epistemic_drift.py
        language: python
        pass_filenames: false

      - id: validate-financial-contract
        name: validate financial contract
        entry: python scripts/validate_financial_contract.py
        language: python
        pass_filenames: false
      - id: generate-claim-graph
        name: generate claim graph
        entry: python scripts/generate_claim_graph.py
        language: python
        pass_filenames: false
      - id: claims-lifecycle
        name: claims lifecycle guard
        entry: python scripts/claims_lifecycle.py
        language: python
        pass_filenames: false
      - id: verify-claim-hashes
        name: verify claim hashes
        entry: python scripts/verify_claim_hashes.py
        language: python
        pass_filenames: false
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args:
          [
            "--baseline",
            ".secrets.baseline",
            "--exclude-files",
            "^INVENTORY\\.json$",
          ]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.22.1
    hooks:
      - id: gitleaks
