# Diff-bound commit acceptor for the experimental dopamine RPE extension surface.
#
# Adds an OPTIONAL, non-invasive research surface around the canonical TD(0)
# identity delta = reward + gamma * next_value - value. It promotes no claim,
# wires nothing into production policy, mutates no DopamineController state, and
# touches no trading/execution/forecast/policy path. The canonical anchor is
# preserved verbatim; every extension layer (distributional, asymmetric-alpha,
# risk-adjusted reward, average-reward vigor) is a pure function over it.
#
# Locally verified on origin/main base:
#   * pytest tests/core/neuro/dopamine/test_experimental_rpe.py: 8 passed
#   * ruff check on both files: clean
#   * mypy --strict src/geosync/core/neuro/dopamine/experimental_rpe.py: 0 issues
id: dopamine-rpe-extension-surface
status: ACTIVE
claim_type: governance
promise: >-
  After this PR lands, src/geosync/core/neuro/dopamine/experimental_rpe.py
  exposes a pure, non-invasive RPE extension surface whose canonical_td_error
  reproduces the textbook TD(0) identity delta = reward + gamma*next_value -
  value exactly, and whose optional layers (distributional_td_error,
  asymmetric_value_update, risk_adjusted_reward, average_reward_vigor,
  compute_rpe_extension_surface) are pure functions that mutate no controller
  state and route no production decision. tests/core/neuro/dopamine/
  test_experimental_rpe.py binds these behaviors, including non-finite output
  rejection after arithmetic; the change touches no trading, execution,
  forecast, or policy path and promotes no market claim.
diff_scope:
  changed_files:
    - path: ".claude/commit_acceptors/dopamine-rpe-extension-surface.yaml"
    - path: "src/geosync/core/neuro/dopamine/experimental_rpe.py"
    - path: "tests/core/neuro/dopamine/test_experimental_rpe.py"
    - path: "docs/research/dopamine_rpe_extension_surface.md"
  forbidden_paths:
    - "trading/"
    - "execution/"
    - "forecast/"
    - "policy/"
    - "application/"
    - "geosync_hpc/"
    - "physics_contracts/catalog.yaml"
required_python_symbols:
  - "RPEExtensionConfig"
  - "RPEExtensionSurface"
  - "canonical_td_error"
  - "risk_adjusted_reward"
  - "distributional_td_error"
  - "asymmetric_value_update"
  - "average_reward_vigor"
  - "compute_rpe_extension_surface"
expected_signal: >-
  `python -m pytest tests/core/neuro/dopamine/test_experimental_rpe.py`
  reports 8 passed; ruff check on the source and test files is clean; mypy
  --strict on the source file exits 0 with no issues.
measurement_command: >-
  bash -c 'mkdir -p tmp && python -m pytest
  tests/core/neuro/dopamine/test_experimental_rpe.py
  > tmp/dopamine_rpe_extension_surface.log 2>&1
  && grep -q "8 passed" tmp/dopamine_rpe_extension_surface.log'
signal_artifact: "tmp/dopamine_rpe_extension_surface.log"
falsifier:
  command: |-
    bash -c 'python -c "
    import importlib.util, sys, random
    spec = importlib.util.spec_from_file_location(
        \"experimental_rpe\",
        \"src/geosync/core/neuro/dopamine/experimental_rpe.py\",
    )
    m = importlib.util.module_from_spec(spec)
    sys.modules[\"experimental_rpe\"] = m
    spec.loader.exec_module(m)
    rng = random.Random(7)
    breached = False
    for _ in range(2000):
        r = rng.uniform(-5.0, 5.0)
        v = rng.uniform(-5.0, 5.0)
        nv = rng.uniform(-5.0, 5.0)
        g = rng.uniform(1e-6, 1.0)
        expected = r + g * nv - v
        if abs(m.canonical_td_error(r, v, nv, g) - expected) > 1e-12:
            breached = True
            break
    sys.exit(0 if breached else 1)"'
  description: >-
    Inverse probe of the non-invasiveness anchor. It exits 0 (fires) iff
    canonical_td_error ever deviates from the textbook TD(0) identity
    reward + gamma*next_value - value beyond 1e-12 over a randomized sweep of
    reward / value / next_value / discount inputs. While the anchor is faithful
    the probe exits 1. If it ever exits 0, the extension surface has silently
    altered the canonical RPE and the change must be reverted, not patched
    green, because every downstream layer derives from this identity.
rollback_command: >-
  git rm -f
  src/geosync/core/neuro/dopamine/experimental_rpe.py
  tests/core/neuro/dopamine/test_experimental_rpe.py
  docs/research/dopamine_rpe_extension_surface.md
  .claude/commit_acceptors/dopamine-rpe-extension-surface.yaml
rollback_verification_command: >-
  bash -c 'test ! -f src/geosync/core/neuro/dopamine/experimental_rpe.py'
memory_update_type: none
ledger_path: ".claude/commit_acceptors/dopamine-rpe-extension-surface.yaml"
report_path: "tmp/dopamine_rpe_extension_surface.log"
evidence: []
