id: pr-gate-manifest-artifact-scope
status: ACTIVE
claim_type: governance
promise: >-
  The PR Gate managed inventory now includes scripts/ci/registry_reconcile_law_T1_T7_falsifier.py,
  a tracked file under the managed scripts/ci scope that was missing from INVENTORY.json.
  The patch is inventory-only governance repair: no runtime behavior, source logic, score,
  target interval, or final validation claim is changed.

diff_scope:
  changed_files:
    - path: "INVENTORY.json"
    - path: ".claude/commit_acceptors/pr-gate-manifest-artifact-scope.yaml"
    - path: ".claude/commit_acceptors/issue-1228-slice1-ricci-carriers.yaml"
    - path: "artifacts/physics_validation/issue_1228_slice1_verdict.json"
  forbidden_paths:
    - "core/"
    - "runtime/"
    - "trading/"
    - "execution/"
    - "forecast/"
    - "policy/"

required_python_symbols: []

expected_signal: >-
  Inventory sync passes because every tracked file in the managed scopes is represented
  by a valid path and 64-character sha256 entry.

measurement_command: >-
  bash -c 'python scripts/ci/check_inventory_sync.py'

signal_artifact: "stdout"

falsifier:
  command: >-
    bash -c 'python scripts/ci/check_inventory_sync.py'
  description: >-
    Fails if INVENTORY.json is missing tracked managed files or contains orphan or invalid entries.

rollback_command: >-
  bash -c 'git checkout -- INVENTORY.json && git rm -f .claude/commit_acceptors/pr-gate-manifest-artifact-scope.yaml'
rollback_verification_command: >-
  bash -c 'test ! -e .claude/commit_acceptors/pr-gate-manifest-artifact-scope.yaml'

memory_update_type: append
ledger_path: ".claude/commit_acceptors/pr-gate-manifest-artifact-scope.yaml"
report_path: "stdout"
