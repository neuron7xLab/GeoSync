id: pr-gate-manifest-artifact-scope
status: ACTIVE
claim_type: governance
promise: >-
  PR Gate managed inventory includes scripts/ci/registry_reconcile_law_T1_T7_falsifier.py.
  This is governance metadata only. No runtime behavior, score, target interval,
  or final validation claim is changed.

diff_scope:
  changed_files:
    - path: "INVENTORY.json"
    - path: ".claude/commit_acceptors/pr-gate-manifest-artifact-scope.yaml"
    - path: ".claude/commit_acceptors/issue-1228-slice2-unit-carriers.yaml"
    - path: "artifacts/physics_validation/issue_1228_slice2_units_verdict.json"
  forbidden_paths:
    - "core/"
    - "runtime/"
    - "trading/"
    - "execution/"
    - "forecast/"
    - "policy/"

required_python_symbols: []

expected_signal: >-
  Inventory sync passes for managed repository scopes.

measurement_command: >-
  python scripts/ci/check_inventory_sync.py

signal_artifact: "stdout"

falsifier:
  command: >-
    python scripts/ci/check_inventory_sync.py
  description: >-
    Fails if INVENTORY.json is missing tracked managed files or contains invalid entries.

rollback_command: >-
  git checkout -- INVENTORY.json
rollback_verification_command: >-
  git status --short INVENTORY.json

memory_update_type: append
ledger_path: ".claude/commit_acceptors/pr-gate-manifest-artifact-scope.yaml"
report_path: "stdout"
