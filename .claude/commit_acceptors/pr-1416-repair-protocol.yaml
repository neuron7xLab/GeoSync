    python -c "from pathlib import Path; text=Path('docs/ci/pr-1416-fail-closed-repair-protocol.md').read_text(encoding='utf-8'); assert 'BUG-001' in text and 'BUG-002' in text and 'No-weakening rules' in text"
  description: >-
    Fails if the PR #1416 repair protocol is missing or no longer contains the
    critical failure/observability gaps and no-weakening constraints.
rollback_command: >-
  python -c "print('Manual rollback: remove docs/ci/pr-1416-fail-closed-repair-protocol.md and .claude/commit_acceptors/pr-1416-repair-protocol.yaml if this documentation-only handoff is no longer needed.')"
rollback_verification_command: >-
  python -c "from pathlib import Path; print('rollback verification is manual for documentation-only handoff')"
memory_update_type: none
