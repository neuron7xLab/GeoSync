measurement_command: >-
  python -c "from pathlib import Path; p=Path('docs/ci/pr-1416-fail-closed-repair-protocol.md'); text=p.read_text(encoding='utf-8'); assert 'BUG-001' in text and 'BUG-002' in text and 'No-weakening rules' in text; Path('tmp').mkdir(exist_ok=True); Path('tmp/pr_1416_repair_protocol.log').write_text('PASS: PR #1416 repair protocol is present and governed', encoding='utf-8')"
signal_artifact: "tmp/pr_1416_repair_protocol.log"
