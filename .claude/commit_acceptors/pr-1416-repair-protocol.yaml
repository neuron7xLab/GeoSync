promise: >-
  Adds a fail-closed PR #1416 repair handoff protocol for Claude Code without
  changing runtime, research, trading, execution, or test semantics.
diff_scope:
  changed_files:
    - path: ".claude/commit_acceptors/pr-1416-repair-protocol.yaml"
    - path: "docs/ci/pr-1416-fail-closed-repair-protocol.md"
  forbidden_paths:
    - "core/"
    - "backtest/"
    - "execution/"
    - "analytics/"
    - "research/systemic_risk/"
required_python_symbols: []
expected_signal: >-
  The PR #1416 fail-closed repair protocol exists, names the critical red and
  observability gaps, preserves no-weakening rules, and remains governed by a
