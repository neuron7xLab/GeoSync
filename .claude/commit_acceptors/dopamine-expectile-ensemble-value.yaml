# Diff-bound commit acceptor for the expectile-ensemble dopamine value learner.
#
# Promotes the stateless RPE helpers into one coherent online distributional
# value learner (expectile regression, Dabney et al. 2020 Nature 577:671). It
# stays non-invasive: a symmetric channel reduces EXACTLY to the canonical
# TD(0) target, no DopamineController state is touched, INV-DA1/DA7 are
# untouched, and nothing is wired into production. Pure functions of numpy;
# fully deterministic (no RNG).
#
# Locally verified on origin/main base:
#   * pytest tests/core/neuro/dopamine/test_expectile_value.py: all passed
#   * ruff check on both files: clean
#   * mypy --strict src/geosync/core/neuro/dopamine/expectile_value.py: 0 issues
id: dopamine-expectile-ensemble-value
status: ACTIVE
claim_type: governance
promise: >-
  After this PR lands, src/geosync/core/neuro/dopamine/expectile_value.py
  provides ExpectileEnsembleValue, an online expectile-regression value learner
  in which each channel's asymmetric learning rates fix its expectile level via
  tau = alpha_pos / (alpha_pos + alpha_neg), the tau=0.5 channel reproduces the
  canonical TD(0) mean exactly, the expectile curve is monotone in tau, and
  every estimate stays inside the convex hull of the targets. expectile_of_samples
  computes the analytic expectile the online learner must converge to.
  tests/core/neuro/dopamine/test_expectile_value.py binds these as INV-EXP1..5
  plus a two-part falsifier. The change touches no DopamineController state and
  no trading/execution/forecast/policy path, and promotes no market claim.
diff_scope:
  changed_files:
    - path: ".claude/commit_acceptors/dopamine-expectile-ensemble-value.yaml"
    - path: "src/geosync/core/neuro/dopamine/expectile_value.py"
    - path: "tests/core/neuro/dopamine/test_expectile_value.py"
  forbidden_paths:
    - "trading/"
    - "execution/"
    - "forecast/"
    - "policy/"
    - "application/"
    - "geosync_hpc/"
    - "physics_contracts/catalog.yaml"
required_python_symbols:
  - "ExpectileChannel"
  - "ExpectileEnsembleValue"
  - "expectile_of_samples"
expected_signal: >-
  `python -m pytest tests/core/neuro/dopamine/test_expectile_value.py`
  reports all passed; ruff check on the source and test files is clean; mypy
  --strict on the source file exits 0 with no issues.
measurement_command: >-
  bash -c 'mkdir -p tmp && python -m pytest
  tests/core/neuro/dopamine/test_expectile_value.py
  > tmp/dopamine_expectile_ensemble_value.log 2>&1
  && grep -q "passed" tmp/dopamine_expectile_ensemble_value.log'
signal_artifact: "tmp/dopamine_expectile_ensemble_value.log"
falsifier:
  command: |-
    bash -c 'python -c "
    import importlib.util, sys, numpy as np
    spec = importlib.util.spec_from_file_location(
        \"ev\", \"src/geosync/core/neuro/dopamine/expectile_value.py\"
    )
    m = importlib.util.module_from_spec(spec)
    sys.modules[\"ev\"] = m
    spec.loader.exec_module(m)
    rng = np.random.default_rng(7)
    fired = False
    for tau in (0.1, 0.5, 0.9):
        x = rng.normal(0.0, 1.0, 500)
        e = m.expectile_of_samples(x, tau)
        w = np.where(x > e, tau, 1.0 - tau)
        if abs(float((w * (x - e)).sum())) > 1e-6:
            fired = True
    sys.exit(0 if fired else 1)"'
  description: >-
    Inverse probe of the expectile fixed-point identity. It exits 0 (fires) iff
    the analytic expectile returned by expectile_of_samples is NOT a true
    expectile of the sample set — i.e. the asymmetrically weighted residual
    sum_i w_i (x_i - e), with w_i = tau if x_i > e else (1 - tau), departs from
    zero by more than 1e-6 for any tau in {0.1, 0.5, 0.9}. While the identity
    holds the probe exits 1. If it ever exits 0, the online learner has no valid
    target and the estimator is not expectile regression; the change must be
    reverted, not patched green.
rollback_command: >-
  git rm -f
  src/geosync/core/neuro/dopamine/expectile_value.py
  tests/core/neuro/dopamine/test_expectile_value.py
  .claude/commit_acceptors/dopamine-expectile-ensemble-value.yaml
rollback_verification_command: >-
  bash -c 'test ! -f src/geosync/core/neuro/dopamine/expectile_value.py'
memory_update_type: none
ledger_path: ".claude/commit_acceptors/dopamine-expectile-ensemble-value.yaml"
report_path: "tmp/dopamine_expectile_ensemble_value.log"
evidence: []
