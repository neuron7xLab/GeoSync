# Diff-bound acceptor for main-push CI stability repair.

id: ci-push-gate-stability
status: ACTIVE
claim_type: fail_closed
promise: >-
  Main-push integrity gates now preserve enforcement evidence instead of being
  cancelled by later merges, while the repository-integrity proof is re-bound to
  the current invariant witness count. This closes the stale 112-count failure
  and prevents push-time research/repo verdicts from disappearing before they
  emit a terminal result.

diff_scope:
  changed_files:
    - path: ".claude/commit_acceptors/ci-push-gate-stability.yaml"
    - path: ".github/workflows/repo-integrity-gate.yml"
    - path: ".github/workflows/research-integrity-gate.yml"
    - path: "scripts/ci/prove_repo_integrity.sh"
  forbidden_paths:
    - "core/"
    - "backtest/"
    - "execution/"
    - "analytics/"
    - "research/systemic_risk/"

required_python_symbols: []
expected_signal: >-
  scripts/count_invariants.py returns 132, prove_repo_integrity.sh expects 132,
  and repo/research integrity workflows cancel only superseded pull-request runs,
  not main push enforcement runs.
measurement_command: >-
  bash -c 'mkdir -p tmp && test "$(python scripts/count_invariants.py)" = "132" && grep -q "\"132\"" scripts/ci/prove_repo_integrity.sh && grep -q "github.event_name == .pull_request." .github/workflows/repo-integrity-gate.yml && grep -q "github.event_name == .pull_request." .github/workflows/research-integrity-gate.yml | tee tmp/ci_push_gate_stability.log'
signal_artifact: "tmp/ci_push_gate_stability.log"
falsifier:
  command: >-
    bash -c 'test "$(python scripts/count_invariants.py)" = "132" && grep -q "\"132\"" scripts/ci/prove_repo_integrity.sh && grep -q "github.event_name == .pull_request." .github/workflows/repo-integrity-gate.yml && grep -q "github.event_name == .pull_request." .github/workflows/research-integrity-gate.yml'
  description: >-
    Fails if the invariant witness pin drifts away from the current count or if
    either main-push integrity workflow returns to unconditional cancellation.
rollback_command: >-
  bash -c 'git checkout origin/main -- .github/workflows/repo-integrity-gate.yml .github/workflows/research-integrity-gate.yml scripts/ci/prove_repo_integrity.sh && git rm -f .claude/commit_acceptors/ci-push-gate-stability.yaml'
rollback_verification_command: >-
  bash -c 'grep -q "\"112\"" scripts/ci/prove_repo_integrity.sh'
memory_update_type: append
ledger_path: ".claude/commit_acceptors/ci-push-gate-stability.yaml"
report_path: "tmp/ci_push_gate_stability.log"
