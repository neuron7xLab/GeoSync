id: canonical-action-result-comparator
status: ACTIVE
claim_type: correctness
promise: Every control action is bound to a sealed expected outcome before dispatch; missing predictions fail closed, comparator chronology is hash/sequence-bound, and DRO-ARA free energy is fed by deterministic comparator error.
