  - path: scripts/aar_pro_smoke.py
  forbidden_paths:
  - trading/
  - execution/
  - forecast/
  - policy/
required_python_symbols:
- ActionResultComparator
- ActionResultEvidence
- ControlEpisode
- AARTracker
- accept_action_result
- compare_action_result
- seal_action_result_evidence
- _ara_comparator_error
- _CausalChronology
- prescribe_recovery
expected_signal: 'AAR-PRO partitioned scoped acceptor validation is warning-clean and targeted tests pass: strict no-default AAR tracker, deterministic control comparator, precision-extreme rollback, deterministic evidence sealing, operational smoke/readiness replay, self-healing recovery planning, causal hash-chain chronology, adaptive variational energy, bounded ARA buffers, machine-readable invariant registry, TLA+ chronology contract, chronology annulment, and DRO-ARA free-energy circuit breaker invariants.'
