# Diff-bound acceptor: dependency all-strict floor consistency.
#
# constraints/security.txt is the source of truth for security-critical floors.
# The previous gate enforced pyproject strictly while requirements*.txt could
# still lag as advisory findings. Task 2 closes that gap for release evidence:
# --all-strict must reject drift across pyproject.toml, requirements.txt, and
# requirements-backend.txt.

id: dependency-manifest-floor-consistency
status: ACTIVE
claim_type: security
promise: >-
  Aligns requirements.txt fastapi to the constraints/security.txt floor
  (fastapi>=0.136.3,<1.0.0) and tightens the dependency manifest consistency
  evidence path. tools/security/check_dependency_manifest_consistency.py still
  keeps default pyproject strict mode for fast diagnosis, but --all-strict is
  the release-grade gate for pyproject.toml, requirements.txt, and
  requirements-backend.txt. tests/security/test_dependency_manifest_consistency.py
  now asserts that strict plus advisory/all-strict violations are empty on the
  live tree. docs/security/dependency_policy.md documents the closed Task 2
  all-strict boundary. No runtime behavior or numerical output is changed.
diff_scope:
  changed_files:
    - path: ".claude/commit_acceptors/dependency-manifest-floor-consistency.yaml"
    - path: "tools/security/check_dependency_manifest_consistency.py"
    - path: "tests/security/test_dependency_manifest_consistency.py"
    - path: "docs/security/dependency_policy.md"
    - path: "requirements.txt"
  forbidden_paths:
    - "trading/"
    - "execution/"
    - "forecast/"
    - "policy/"
required_python_symbols:
  - "check_manifest"
  - "evaluate"
expected_signal: >-
  python tools/security/check_dependency_manifest_consistency.py --all-strict
  exits 0, and pytest -q tests/security/test_dependency_manifest_consistency.py
  passes including test_all_security_manifest_floors_consistent_with_policy.
  Reverting requirements.txt fastapi to a floor below constraints/security.txt
  makes --all-strict fail and makes the live all-manifest pytest invariant fail.
measurement_command: >-
  PYTHONPATH=. python -m pytest tests/security/test_dependency_manifest_consistency.py -v
signal_artifact: "tmp/dependency_manifest_consistency_pytest.log"
falsifier:
  command: >-
    PYTHONPATH=. python tools/security/check_dependency_manifest_consistency.py --all-strict
  description: >-
    On the pre-patch tree, requirements.txt admitted fastapi below the
    constraints/security.txt floor, so --all-strict reported an ERROR for
    requirements.txt and exited non-zero. After the patch, the same gate is
    expected to exit 0. The pytest live invariant pins the behavior so a future
    manifest drift fails before release promotion.
rollback_command: >-
  git checkout HEAD~1 --
  requirements.txt
  tools/security/check_dependency_manifest_consistency.py
  tests/security/test_dependency_manifest_consistency.py
  docs/security/dependency_policy.md
  .claude/commit_acceptors/dependency-manifest-floor-consistency.yaml
rollback_verification_command: >-
  git diff --exit-code requirements.txt
memory_update_type: none
ledger_path: ".claude/commit_acceptors/dependency-manifest-floor-consistency.yaml"
report_path: "docs/reports/diff_bound_commit_acceptor_layer.md"
evidence: []
