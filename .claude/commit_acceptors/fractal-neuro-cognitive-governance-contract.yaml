# Diff-bound commit acceptor for the fractal/neuro-cognitive governance contract PR.
#
# Purpose:
#   Bind this governance-only PR to explicit evidence, rollback, calibration,
#   filtering, and claim boundary. This acceptor intentionally does not validate
#   cognition, physics, prediction, market readiness, or model-weight update claims.

id: fractal-neuro-cognitive-governance-contract
status: ACTIVE
claim_type: governance
promise: >-
  After this PR lands, GeoSync contains machine-readable and human-readable
  governance artifacts for claim-state quantization, fractal neuro-cognitive
  prompt contracts, FVPS value-function contracts, Neuron7X value-function
  scoring, Neuron7X calibration thresholds, and Neuron7X signal filtering rules.
  The PR adds governance data, schemas, docs, a deterministic claim-state
  quantizer, and tests. It does not change runtime, physics, market, or trading
  behavior.

diff_scope:
  changed_files:
    - path: ".claude/commit_acceptors/fractal-neuro-cognitive-governance-contract.yaml"
    - path: "data/governance/fractal_neuro_cognitive_architecture_v2026_1.json"
    - path: "docs/architecture/fractal_neuro_cognitive_architecture_v2026_1.md"
    - path: "schemas/governance/fractal_neuro_cognitive_execution.schema.json"
    - path: "docs/governance/claim_state_quantum_input.md"
    - path: "schemas/governance/claim_state_quantum_input.schema.json"
    - path: "tools/governance/quantize_claim_state.py"
    - path: "tests/governance/test_claim_state_quantum_input.py"
    - path: "docs/prompts/fractal_neuro_cognitive_research_agent_v2026_1.md"
    - path: "data/governance/fractal_neuro_cognitive_research_agent_v2026_1.json"
    - path: "docs/prompts/fvps_agent_v2026_3.md"
    - path: "data/governance/fvps_agent_v2026_3.json"
    - path: "docs/prompts/fvps_max_inference_rank_prompt_v2026_4.md"
    - path: "data/governance/fvps_max_inference_rank_prompt_v2026_4.json"
    - path: "docs/prompts/neuron7x_value_functions_v2026_5.md"
    - path: "data/governance/neuron7x_value_functions_v2026_5.json"
    - path: "docs/prompts/neuron7x_calibration_protocol_v2026_6.md"
    - path: "data/governance/neuron7x_calibration_protocol_v2026_6.json"
    - path: "docs/prompts/neuron7x_filter_protocol_v2026_7.md"
    - path: "data/governance/neuron7x_filter_protocol_v2026_7.json"
  forbidden_paths:
    - "trading/"
    - "execution/"
    - "forecast/"
    - "policy/"
    - "core/"
    - "runtime/"
    - "application/"
    - "analytics/"
    - "research/"

required_python_symbols:
  - "tools/governance/quantize_claim_state.py::ClaimState"
  - "tools/governance/quantize_claim_state.py::missing_required_links"
  - "tools/governance/quantize_claim_state.py::quantize_claim_state"
  - "tools/governance/quantize_claim_state.py::validate_declared_state"
  - "tests/governance/test_claim_state_quantum_input.py::test_empty_envelope_is_untested"
  - "tests/governance/test_claim_state_quantum_input.py::test_missing_links_are_partial"
  - "tests/governance/test_claim_state_quantum_input.py::test_same_sha_green_ci_is_ci_verified"
  - "tests/governance/test_claim_state_quantum_input.py::test_real_data_replay_baseline_falsifier_semantic_validation_is_evidence_bearing"
  - "tests/governance/test_claim_state_quantum_input.py::test_declared_state_cannot_round_up"

expected_signal: >-
  The governance claim-state quantizer deterministically maps evidence envelopes
  into the discrete states FALSE, UNTESTED, PARTIAL, LOCAL_VERIFIED, CI_VERIFIED,
  or EVIDENCE_BEARING, rejects upward declared-state drift, and the governance
  prompt/data artifacts define value-function scoring, calibration thresholds,
  and signal filtering rules without claiming runtime, physics, market, or
  trading behavior changes.

measurement_command: >-
  bash -c '
    python -m compileall -q tools tests schemas data docs
    && python -m pytest -q tests/governance/test_claim_state_quantum_input.py
  '

signal_artifact: "tmp/fractal_neuro_cognitive_governance_contract.log"

falsifier:
  command: >-
    bash -c '
      python - <<"PY"
      from tools.governance.quantize_claim_state import validate_declared_state
      envelope = {
          "claim_id": "upward-drift-probe",
          "claim_text": "partial evidence must not be promoted",
          "declared_state": "CI_VERIFIED",
          "source_refs": ["source"],
      }
      result = validate_declared_state(envelope)
      raise SystemExit(0 if result["upward_drift"] else 1)
      PY
    '
  description: >-
    Probes that a partial evidence envelope declared as CI_VERIFIED is rejected
    as upward state drift. The falsifier succeeds only when the promotion
    firewall is active.

rollback_command: >-
  bash -c '
    git rm -f
      .claude/commit_acceptors/fractal-neuro-cognitive-governance-contract.yaml
      data/governance/fractal_neuro_cognitive_architecture_v2026_1.json
      docs/architecture/fractal_neuro_cognitive_architecture_v2026_1.md
      schemas/governance/fractal_neuro_cognitive_execution.schema.json
      docs/governance/claim_state_quantum_input.md
      schemas/governance/claim_state_quantum_input.schema.json
      tools/governance/quantize_claim_state.py
      tests/governance/test_claim_state_quantum_input.py
      docs/prompts/fractal_neuro_cognitive_research_agent_v2026_1.md
      data/governance/fractal_neuro_cognitive_research_agent_v2026_1.json
      docs/prompts/fvps_agent_v2026_3.md
      data/governance/fvps_agent_v2026_3.json
      docs/prompts/fvps_max_inference_rank_prompt_v2026_4.md
      data/governance/fvps_max_inference_rank_prompt_v2026_4.json
      docs/prompts/neuron7x_value_functions_v2026_5.md
      data/governance/neuron7x_value_functions_v2026_5.json
      docs/prompts/neuron7x_calibration_protocol_v2026_6.md
      data/governance/neuron7x_calibration_protocol_v2026_6.json
      docs/prompts/neuron7x_filter_protocol_v2026_7.md
      data/governance/neuron7x_filter_protocol_v2026_7.json
  '

rollback_verification_command: >-
  bash -c '
    test ! -e tools/governance/quantize_claim_state.py
    && test ! -e tests/governance/test_claim_state_quantum_input.py
    && test ! -e docs/prompts/neuron7x_calibration_protocol_v2026_6.md
    && test ! -e data/governance/neuron7x_calibration_protocol_v2026_6.json
    && test ! -e docs/prompts/neuron7x_filter_protocol_v2026_7.md
    && test ! -e data/governance/neuron7x_filter_protocol_v2026_7.json
  '

memory_update_type: append
ledger_path: ".claude/commit_acceptors/fractal-neuro-cognitive-governance-contract.yaml"
report_path: "tmp/fractal_neuro_cognitive_governance_contract.log"
evidence: []
