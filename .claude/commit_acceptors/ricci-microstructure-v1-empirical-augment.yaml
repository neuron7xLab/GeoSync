# Diff-bound commit acceptor: empirical augmentation of PR #1242
# (ricci_microstructure_v1 lane).
#
# PR #1242 shipped the Ollivier-Ricci-on-L2 lane (geosync_research/lines/...) but
# had never run on real data and carried two defects: ingest hardcoded
# source=="LOBSTER", and the schema-rejection path raised pandera's SchemaError
# positionally (TypeError -> red tests). This change augments it with ONLY the
# missing empirical/governance pieces and the two fixes:
#   * honest source: ingest accepts an ALLOWED_SOURCES allowlist and carries the
#     real source through verbatim (committed substrate is BINANCE_FUTURES_DEPTH,
#     public REST depth — never relabelled LOBSTER);
#   * DataFrameSchemaError is a dedicated single-message ValueError (fixes the
#     pre-existing TypeError; pandera errors normalised to it);
#   * a real, SHA-pinned Binance L2 session + manifest + collector;
#   * the committed MEASURED negative-result artifact + evidence bundle;
#   * REPRODUCIBILITY_CAPSULE.sh, CI gate, and Makefile ricci-* targets.
# Black-only reformatting of sibling lane files to satisfy the line-length-100
# python-quality gate. No inference logic of #1242 is altered; allowed terminal
# statuses stay SUPPORTED | HYPOTHESIS_NOT_SUPPORTED | INVALID.

id: ricci-microstructure-v1-empirical-augment
status: ACTIVE
claim_type: correctness
promise: >-
  After this change, geosync-research ingest accepts a BINANCE_FUTURES_DEPTH
  manifest and records the source honestly (never LOBSTER); validate_l2_frame
  fails closed via a single-message DataFrameSchemaError on missing column /
  negative size / non-monotonic timestamp (no TypeError); the reproducibility
  capsule runs ingest -> run -> verify -> SHA-compare on the committed frozen
  Binance session and emits a schema-valid artifact whose falsification_status is
  one of SUPPORTED | HYPOTHESIS_NOT_SUPPORTED | INVALID; the committed canonical
  artifact is HYPOTHESIS_NOT_SUPPORTED with claim_tier T3 (no promotion, no alpha
  / production / physics claim).

diff_scope:
  changed_files:
    - path: ".claude/commit_acceptors/ricci-microstructure-v1-empirical-augment.yaml"
    - path: "geosync_research/lines/ricci_microstructure_v1/ingest.py"
    - path: "geosync_research/lines/ricci_microstructure_v1/collect_binance_l2.py"
    - path: "geosync_research/lines/ricci_microstructure_v1/REPRODUCIBILITY_CAPSULE.sh"
    - path: "geosync_research/lines/ricci_microstructure_v1/graph_builder.py"
    - path: "geosync_research/lines/ricci_microstructure_v1/ricci_kernel.py"
    - path: "geosync_research/lines/ricci_microstructure_v1/artifact.py"
    - path: "geosync_research/lines/ricci_microstructure_v1/synthetic_controls.py"
    - path: "geosync_research/lines/ricci_microstructure_v1/runner.py"
    - path: "geosync_research/lines/ricci_microstructure_v1/stability.py"
    - path: "tools/research/research_cli.py"
    - path: "tests/research_lines/test_ricci_microstructure_v1.py"
    - path: "schemas/research/ricci_microstructure_artifact.schema.json"
    - path: "CLAIMS.md"
    - path: "artifacts/claims_hashes.json"
    - path: ".github/workflows/ricci-microstructure-gate.yml"
    - path: "Makefile"
    - path: "data/l2_manifest.json"
    - path: ".github/claim_boundary_allow.json"
    - path: "artifacts/claims_hashes.json"
  forbidden_paths:
    - "trading/"
    - "execution/"
    - "forecast/"
    - "policy/"

required_python_symbols:
  - "geosync_research/lines/ricci_microstructure_v1/ingest.py::ingest_manifest"
  - "geosync_research/lines/ricci_microstructure_v1/ingest.py::validate_l2_frame"
  - "geosync_research/lines/ricci_microstructure_v1/collect_binance_l2.py::collect"

expected_signal: >-
  pytest tests/research_lines/test_ricci_microstructure_v1.py reports all tests
  passed (schema-rejection tests now raise DataFrameSchemaError cleanly instead
  of TypeError); the reproducibility capsule exits 0 with a HYPOTHESIS_NOT_SUPPORTED
  artifact and a matching data_sha256.

measurement_command: >-
  bash -c '
    PYTHONPATH=. python -m pytest tests/research_lines/test_ricci_microstructure_v1.py -q -p no:cacheprovider
  '

signal_artifact: "tmp/ricci_microstructure_v1_augment.log"

falsifier:
  command: >-
    bash -c 'PYTHONPATH=. python -c "import sys, pytest, pandas as pd;
    from geosync_research.lines.ricci_microstructure_v1.ingest import validate_l2_frame, DataFrameSchemaError;
    cols=[\"timestamp\",\"price\",\"bid_px_1\",\"ask_px_1\",\"bid_sz_1\",\"ask_sz_1\"];
    df=pd.DataFrame([[1,100.0,99.0,101.0,-1.0,1.0]], columns=cols);
    pytest.raises(DataFrameSchemaError, validate_l2_frame, df, depth=1);
    sys.exit(0)"'
  description: >-
    Inverts the fail-closed contract: validate_l2_frame MUST reject a negative
    size by raising DataFrameSchemaError (a single-message ValueError), NOT a
    TypeError. pytest.raises in callable form exits 0 only when that exact type is
    raised; reintroducing the pandera-positional alias raises TypeError instead
    and flips this to a non-zero exit.

rollback_command: >-
  bash -c '
    git checkout origin/feat/ricci-microstructure-v1 --
      geosync_research/lines/ricci_microstructure_v1/ingest.py
      geosync_research/lines/ricci_microstructure_v1/graph_builder.py
      geosync_research/lines/ricci_microstructure_v1/ricci_kernel.py
      geosync_research/lines/ricci_microstructure_v1/artifact.py
      geosync_research/lines/ricci_microstructure_v1/synthetic_controls.py
      tools/research/research_cli.py Makefile
    && git rm -f geosync_research/lines/ricci_microstructure_v1/collect_binance_l2.py
      geosync_research/lines/ricci_microstructure_v1/REPRODUCIBILITY_CAPSULE.sh
      .github/workflows/ricci-microstructure-gate.yml data/l2_manifest.json
      .claude/commit_acceptors/ricci-microstructure-v1-empirical-augment.yaml
  '

rollback_verification_command: >-
  bash -c '
    test ! -e geosync_research/lines/ricci_microstructure_v1/collect_binance_l2.py
    && test ! -e .claude/commit_acceptors/ricci-microstructure-v1-empirical-augment.yaml
    && ! grep -q "ALLOWED_SOURCES" geosync_research/lines/ricci_microstructure_v1/ingest.py
  '

memory_update_type: none
ledger_path: ".claude/commit_acceptors/ricci-microstructure-v1-empirical-augment.yaml"
report_path: "docs/NEGATIVE_RESULTS.md"
