id: issue-1228-slice2-unit-carriers
status: ACTIVE
claim_type: governance
promise: >-
  Issue #1228 tasks 12-18 are bound to durable unit-row carriers without granting score credit:
  theta, omega, K, A, R, Phi, and dt are mapped to the units table and unit-state
  test contract. This does not promote static unit labels into physics-invariant witnesses.

diff_scope:
  changed_files:
    - path: ".claude/commit_acceptors/issue-1228-slice1-ricci-carriers.yaml"
    - path: ".claude/commit_acceptors/issue-1228-slice2-unit-carriers.yaml"
    - path: "artifacts/physics_validation/issue_1228_slice1_verdict.json"
    - path: "artifacts/physics_validation/issue_1228_slice2_units_verdict.json"
    - path: "docs/physics/units_table.md"
  forbidden_paths:
    - "core/"
    - "runtime/"
    - "trading/"
    - "execution/"
    - "forecast/"
    - "policy/"

required_python_symbols: []

expected_signal: >-
  The added JSON verdict parses successfully, the units table contains an explicit
  dt row, and the issue-1228 slice-2 unit-row carrier map keeps score credit,
  final validation, and target-interval claims disabled.

measurement_command: >-
  bash -c 'mkdir -p tmp && python -m json.tool artifacts/physics_validation/issue_1228_slice2_units_verdict.json > tmp/issue_1228_slice2_units_verdict.normalized.json && grep -q "| `dt` |" docs/physics/units_table.md'

signal_artifact: "tmp/issue_1228_slice2_units_verdict.normalized.json"

falsifier:
  command: >-
    bash -c 'python -m json.tool artifacts/physics_validation/issue_1228_slice2_units_verdict.json >/dev/null && grep -q "| `dt` |" docs/physics/units_table.md'
  description: >-
    Fails if the unit-row artifact-only verdict is not valid JSON or the dt row is absent from the units table.

rollback_command: >-
  bash -c 'git rm -f artifacts/physics_validation/issue_1228_slice2_units_verdict.json .claude/commit_acceptors/issue-1228-slice2-unit-carriers.yaml && git checkout -- docs/physics/units_table.md'
rollback_verification_command: >-
  bash -c 'test ! -e artifacts/physics_validation/issue_1228_slice2_units_verdict.json'

memory_update_type: append
ledger_path: ".claude/commit_acceptors/issue-1228-slice2-unit-carriers.yaml"
report_path: "tmp/issue_1228_slice2_units_verdict.normalized.json"
