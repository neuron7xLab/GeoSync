id: cognitive-dynamics-operation-log
status: ACTIVE
claim_type: governance
promise: "Adds an append-only operational trace for PR 983 cognitive dynamics integration actions."
diff_scope:
  changed_files:
    - path: ".claude/commit_acceptors/cognitive-dynamics-operation-log.yaml"
    - path: "docs/cognitive_dynamics/OPERATIONS_LOG.md"
  forbidden_paths:
    - "trading/"
    - "execution/"
    - "forecast/"
    - "policy/"
expected_signal: "repository-visible operations log records PR state, workflow state, blocker state, and next action without promoting claim tier"
measurement_command: "test -f docs/cognitive_dynamics/OPERATIONS_LOG.md && grep -q 'active_blocker' docs/cognitive_dynamics/OPERATIONS_LOG.md"
signal_artifact: "docs/cognitive_dynamics/OPERATIONS_LOG.md"
falsifier:
  command: "test -f docs/cognitive_dynamics/OPERATIONS_LOG.md && grep -q 'workflow_success_rate' docs/cognitive_dynamics/OPERATIONS_LOG.md && grep -q 'Do not merge to main while PR Gate is failed' docs/cognitive_dynamics/OPERATIONS_LOG.md"
  description: "The log must remain repository-visible, evidence-only, and must preserve the current blocker and no-merge decision."
rollback_command: "git rm .claude/commit_acceptors/cognitive-dynamics-operation-log.yaml docs/cognitive_dynamics/OPERATIONS_LOG.md"
rollback_verification_command: "git diff --exit-code"
memory_update_type: append
ledger_path: "docs/cognitive_dynamics/OPERATIONS_LOG.md"
report_path: "docs/cognitive_dynamics/OPERATIONS_LOG.md"
evidence: []
