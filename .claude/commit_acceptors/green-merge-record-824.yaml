id: green-merge-record-824
status: ACTIVE
claim_type: governance
promise: >-
  Bind the PR 824 green-merge record to a commit acceptor so post-merge
  audit evidence is diff-bound and reviewable.
diff_scope:
  changed_files:
    - path: ".claude/commit_acceptors/green-merge-record-824.yaml"
    - path: "artifacts/audit/GREEN_MERGE_RECORD_824.json"
  forbidden_paths:
    - "core/"
    - "tests/"
    - ".github/workflows/"
required_python_symbols: []
expected_signal: >-
  Commit Acceptor Gate accepts this governance-only audit record.
measurement_command: >-
  python tools/commit_acceptor/validate_commit_acceptor.py --base origin/main --head HEAD
signal_artifact: "artifacts/audit/GREEN_MERGE_RECORD_824.json"
falsifier:
  command: >-
    bash -c 'test -f artifacts/audit/GREEN_MERGE_RECORD_824.json && exit 1 || exit 0'
  description: >-
    Falsifies this record if the required JSON artifact is absent.
rollback_command: >-
  bash -c 'rm -f artifacts/audit/GREEN_MERGE_RECORD_824.json .claude/commit_acceptors/green-merge-record-824.yaml'
rollback_verification_command: >-
  bash -c '! test -f artifacts/audit/GREEN_MERGE_RECORD_824.json'
memory_update_type: append
ledger_path: ".claude/commit_acceptors/green-merge-record-824.yaml"
report_path: "artifacts/audit/GREEN_MERGE_RECORD_824.json"
evidence:
  - path: "artifacts/audit/GREEN_MERGE_RECORD_824.json"
