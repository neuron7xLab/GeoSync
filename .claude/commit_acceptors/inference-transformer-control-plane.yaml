    command: python tools/research/validate_ricci_artifact_schema.py --semantic --artifact artifacts/runs/ricci_microstructure_v1/example_artifact.json
acceptance:
  claim_tier_impact: none
  research_line_state: HYPOTHESIS
  allowed_artifact_role: placeholder
  implementation_next_step: add contract validator, typed certificate dataclasses, tests, and CI wiring
blockers:
  - claim tier promotion
  - schema weakening
  - dependency-heavy model path
  - network-dependent validation
