line-length = 100
extend-exclude = ["docs/notebooks"]

[lint]
select = ["E", "F", "W", "I"]
ignore = ["E203", "E501"]

[lint.per-file-ignores]
"examples/*.py" = ["E402"]
"benchmarks/*.py" = ["E402"]
"docs/archive/*.py" = ["E402"]
"scripts/eval/*.py" = ["E402"]
"scripts/aar_pro_*.py" = ["E402"]
"tests/core/agent/test_pqf_pscs.py" = ["E402"]
"tests/scripts/test_calibrate_controllers.py" = ["E402"]
"tests/sdk/mlsdm/test_replay_harness.py" = ["E402"]
"coherence_bridge/generated/*.py" = ["ALL"]
"coherence_bridge/*.py" = ["N802", "N806", "N818", "TC001", "TC002", "TC003", "PLC0415"]
