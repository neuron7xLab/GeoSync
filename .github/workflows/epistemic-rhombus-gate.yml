# SPDX-License-Identifier: MIT
#
# Epistemic Rhombus Gate.
#
# Fails closed when the repository-level governance manifest drifts away from
# its JSON schema, loses exactly-once axis coverage, drops a record identity,
# or points at a missing external enforcement target.

name: Epistemic Rhombus Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "CLAIMS.md"
      - "docs/governance/epistemic_rhombus_manifest.md"
      - "governance/epistemic_rhombus_manifest.jsonl"
      - "schemas/governance/epistemic_rhombus_manifest.schema.json"
      - "scripts/validate_epistemic_rhombus_manifest.py"
      - "tests/scripts/test_validate_epistemic_rhombus_manifest.py"
      - ".github/workflows/epistemic-rhombus-gate.yml"
  push:
    branches: [main]
    paths:
      - "CLAIMS.md"
      - "docs/governance/epistemic_rhombus_manifest.md"
      - "governance/epistemic_rhombus_manifest.jsonl"
      - "schemas/governance/epistemic_rhombus_manifest.schema.json"
      - "scripts/validate_epistemic_rhombus_manifest.py"
      - "tests/scripts/test_validate_epistemic_rhombus_manifest.py"
      - ".github/workflows/epistemic-rhombus-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: epistemic-rhombus-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Rhombus manifest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install validator dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema pytest

      - name: Validate live manifest
        run: python scripts/validate_epistemic_rhombus_manifest.py

      - name: Run validator tests
        run: python -m pytest tests/scripts/test_validate_epistemic_rhombus_manifest.py -q
