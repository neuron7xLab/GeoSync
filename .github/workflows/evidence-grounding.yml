name: evidence-grounding

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'docs/METRICS_CONTRACT.md'
      - 'reports/test_audit/**'
      - 'tools/claims/**'
      - 'docs/testing/**'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'
      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
      - name: Run evidence validator
        run: python tools/claims/validate_claims_have_evidence.py | tee evidence-validator.log
      - name: Upload validator log
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: evidence-validator-log
          path: evidence-validator.log
