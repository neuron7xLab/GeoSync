name: evidence-grounding

on:
  pull_request:
    paths:
      - 'docs/METRICS_CONTRACT.md'
      - 'reports/test_audit/**'
      - 'tools/claims/**'
      - 'docs/testing/**'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
      - name: Run evidence validator
        run: python tools/claims/validate_claims_have_evidence.py | tee evidence-validator.log
      - name: Upload validator log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-validator-log
          path: evidence-validator.log
