name: Main Validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: main-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python-full-validation:
    name: python-full-validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # tests/systemic_risk/test_d002h_gate_{f,g}_*.py call
          # `git merge-base --is-ancestor <historical-sha> origin/main`
          # to verify the seven canonical-run authorisation anchors
          # are real ancestors of main. Default actions/checkout depth=1
          # makes those historical commits unavailable -> exit 128
          # ("Not a valid commit name"). Full history is required.
          fetch-depth: 0

      - name: Setup Python environment
        uses: ./.github/actions/setup-geosync
        with:
          python-version: '3.11'
          cache-prefix: main-full-tests

      - name: Verify pip executable
        run: .venv/bin/python -m pip --version

      - name: Run broader post-merge validation suite
        run: |
          # An enforcement gate must COMPLETE. Run serially, this full-suite
          # post-merge validation (~18k tests under coverage) overran the 60-min
          # job cap on most pushes to main (e.g. run 27870261022:
          # python-full-validation ran 60m15s and was killed mid-suite; the
          # coverage guardrail step never ran; conclusion `cancelled` — a silent
          # non-enforcement). Measure in parallel so wall-time is ~CPU/cores;
          # pytest-cov combines per-worker data, so the measured
          # core/backtest/execution surface is unchanged. loadscope keeps a
          # module's tests on one worker. A total hang still fails closed via
          # the job-level timeout-minutes backstop.
          .venv/bin/pytest tests/ -m "not nightly and not flaky" \
            -n auto --dist loadscope \
            --cov=core \
            --cov=backtest \
            --cov=execution \
            --cov-config=configs/quality/critical_surface.coveragerc \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Enforce coverage guardrail
        run: |
          .venv/bin/python -m tools.coverage.guardrail \
            --config configs/quality/critical_surface.toml \
            --coverage coverage.xml

  packaging-smoke:
    name: packaging-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Python environment
        uses: ./.github/actions/setup-geosync
        with:
          python-version: '3.11'
          cache-prefix: main-package

      - name: Verify pip executable
        run: .venv/bin/python -m pip --version

      - name: Build Python package artifacts
        run: .venv/bin/python -m build --sdist --wheel --outdir dist

  frontend-build-smoke:
    name: frontend-build-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Build frontend
        working-directory: apps/web
        run: |
          npm ci
          npm run build

  brand-consistency:
    name: brand-consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'

      - name: Scan for legacy brand identifiers
        run: python tools/quality/brand_consistency.py
