name: Claim Governance Foundation

on:
  pull_request:
    paths:
      - "docs/RESEARCH_THESIS.md"
      - "claims/ontology.json"
      - "scripts/ci/verify_claims.py"
      - "tests/ci/test_verify_claims.py"
      - ".github/workflows/claim-governance-foundation.yml"

permissions:
  contents: read

jobs:
  governance-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.0.0
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Verify seed
        run: python scripts/ci/verify_claims.py
      - name: Run tests
        run: pytest -q tests/ci/test_verify_claims.py
