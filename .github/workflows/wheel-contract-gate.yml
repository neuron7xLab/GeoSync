# SPDX-License-Identifier: MIT
#
# Wheel-contract gate (B.wheel-zero act) — fail-closed, monotone-down. Builds the
# wheel from a clean git archive and proves: every console-script target ships,
# no packaged module imports an unpackaged first-party namespace, and the legacy
# package + import-debt ledger only shrinks (.github/bwheel_baseline.json).
#
# Path-filtered: a PR touching neither packaging, the gate, the baseline, nor
# packaged source skips entirely.
name: Wheel Contract Gate

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
    paths:
      - "pyproject.toml"
      - ".github/bwheel_baseline.json"
      - "scripts/ci/check_wheel_contract.py"
      - ".github/workflows/wheel-contract-gate.yml"
      - "geosync/**"
      - "core/**"
      - "application/**"
      - "tools/**"
      - "scripts/**"
      - "src/**"
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - ".github/bwheel_baseline.json"
      - "scripts/ci/check_wheel_contract.py"
      - ".github/workflows/wheel-contract-gate.yml"

permissions:
  contents: read

jobs:
  validate:
    name: wheel-contract-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build wheel setuptools setuptools_scm

      - name: Enforce wheel contract (ratchet)
        run: python scripts/ci/check_wheel_contract.py

      - name: Upload contract report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-contract
          path: artifacts/wheel_contract.json
          if-no-files-found: ignore
