name: Check Epistemic Drift

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  drift-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # pragma: allowlist secret
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # pragma: allowlist secret
        with:
          python-version: '3.12'
      - name: Verify claim/code invariants sync
        run: python scripts/check_epistemic_drift.py
