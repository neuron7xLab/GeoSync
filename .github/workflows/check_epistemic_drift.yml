name: Check Epistemic Drift

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  drift-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # pragma: allowlist secret
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # pragma: allowlist secret
        with:
          python-version: '3.12'
      - name: Verify claim/code invariants sync
        run: python scripts/check_epistemic_drift.py
