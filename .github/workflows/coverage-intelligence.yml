# SPDX-License-Identifier: MIT
#
# Coverage Intelligence Gate.
#
# Two jobs with deliberately different cadence:
#
#   instrument-selfcheck  (every PR + push)
#       Guards the coverage AUTHORITY itself — the instrument, the canonical
#       release_90.coveragerc, and the gate-relationship tests. Cheap: it runs
#       only the tool's own falsification suite, so it cannot break the PR
#       latency budget (the fast-test lane has a ~20-min cap).
#
#   release-coverage-90  (push to main + nightly + manual)
#       Runs the FULL production-surface measurement and enforces the 90%
#       release gate, the critical surface, and the claim falsifier matrix.
#       This is intentionally NOT on every PR: a full-surface coverage run is
#       too heavy for the PR gate, so it runs where latency is not the
#       constraint. This tradeoff is explicit on purpose — a silent "covered
#       everywhere" that only ran a subset is the exact lie this gate exists
#       to prevent.

name: Coverage Intelligence Gate

# Concurrency is deliberately NOT set at workflow level: the two jobs have
# opposite cancellation semantics and a shared cancel-in-progress would be
# wrong for one of them. It is therefore declared per-job below.
#
#   instrument-selfcheck  -> cancel-in-progress: true
#       A cheap PR/push self-check. A superseded commit's run carries no
#       value, so killing it the moment a newer commit lands is correct.
#
#   release-coverage-90   -> cancel-in-progress: false
#       The heavy push-to-main ENFORCEMENT lane (~25 min full-surface run).
#       Cancelling it mid-flight is exactly the failure that produced
#       run 27791727376: a busy main branch supersedes the gate before it
#       ever measures the surface or emits coverage evidence, leaving a
#       silent "covered everywhere" that never actually ran. An enforcement
#       gate must COMPLETE. With cancel-in-progress:false the running gate is
#       never killed; only the queued (not-yet-started) run is superseded by
#       the newest main, so HEAD-of-main is always the one that gets measured.

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/coverage/**"
      - "configs/quality/**coverage**"
      - "configs/quality/release_90.coveragerc"
      - "configs/quality/critical_surface.toml"
      - "tests/tools/test_coverage_intelligence.py"
      - "tests/audit/test_coverage_honesty.py"
      - "tests/test_coverage_threshold_sync.py"
      - ".github/workflows/coverage-intelligence.yml"
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instrument-selfcheck:
    name: Coverage authority self-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-selfcheck-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install sci-core deps
        # The repo conftest imports the sci-core stack at collection time, so
        # even this lightweight job needs it loadable.
        run: pip install numpy scipy pandas networkx pyyaml jsonschema pytest
      - name: Falsify the coverage authority
        run: |
          python -m pytest \
            tests/tools/test_coverage_intelligence.py \
            tests/audit/test_coverage_honesty.py \
            tests/test_coverage_threshold_sync.py \
            tests/tools/test_coverage_surface_contract.py \
            -q -p no:cacheprovider

  release-coverage-90:
    name: Release coverage gate (90%)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # ~25 min full-surface measurement + enforce; cap well above the
    # observed baseline so a genuine hang fails closed instead of burning
    # the 6-hour default, but never clips a healthy run.
    timeout-minutes: 50
    concurrency:
      group: ${{ github.workflow }}-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          set -euo pipefail
          # [contract] pulls schemathesis so the api-contract claim falsifier
          # (tests/api/test_schemathesis_contract.py) actually runs in this
          # lane — otherwise it is silently uncollected and the claim matrix
          # reports api-contract-openapi-coverage as incomplete.
          python -m pip install -e ".[dev,contract]"
          python -m pip install pytest pytest-cov pyyaml
          python -m pip check
      - name: Prepare coverage evidence directory
        run: |
          set -euo pipefail
          mkdir -p reports/coverage
          printf '%s\n' "coverage measurement has not completed" > reports/coverage/coverage_gap_map.md
      - name: Measure full production surface
        run: make coverage-baseline
      - name: Enforce release gate + critical surface
        run: |
          python -m tools.coverage.geosync_coverage_intelligence \
            --coverage reports/coverage/coverage.xml \
            --junit reports/coverage/junit.xml \
            --targets configs/quality/coverage_targets.toml \
            --critical configs/quality/critical_surface.toml \
            --claims docs/CLAIMS.yaml \
            --out reports/coverage \
            --no-check-staleness \
            --enforce-release-90 --enforce-critical
      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: coverage-intelligence-reports
          path: |
            reports/coverage/coverage.xml
            reports/coverage/junit.xml
            reports/coverage/coverage_summary.json
            reports/coverage/coverage_gap_map.md
            reports/coverage/risk_weighted_coverage.json
            reports/coverage/claim_test_matrix.json
            reports/coverage/next_tests.md
