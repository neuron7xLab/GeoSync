# SPDX-License-Identifier: MIT
name: PR 1400 Fast Diagnostic Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pr1400-fast-diagnostic.yml'
      - '.github/workflows/pr-gate.yml'
      - 'tests/**'
      - 'core/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'pytest.ini'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: pr1400-fast-diagnostic-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  diagnostic:
    name: pr1400-fast-diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      SHARD_COUNT: '8'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Python environment
        uses: ./.github/actions/setup-geosync
        with:
          python-version: '3.11'
          cache-prefix: pr1400-fast-diagnostic

      - name: Collect and run shard evidence
        env:
          MATRIX_GROUP: ${{ matrix.group }}
        run: |
          set +e
          mkdir -p "tmp/pr1400-fast-diagnostic/shard-${MATRIX_GROUP}"
          OUT="tmp/pr1400-fast-diagnostic/shard-${MATRIX_GROUP}"
          MARK="not slow and not heavy_math and not nightly and not flaky"
          export PYTHONUTF8=1
          export PYTHONIOENCODING=utf-8

          .venv/bin/pytest tests/ -m "$MARK" --collect-only 2>"$OUT/collect_stderr.log" \
            | grep -E '^tests/.*::' > "$OUT/all_nodeids.txt" || true

          python - <<'PY'
          import binascii
          import os
          from pathlib import Path

          group = int(os.environ['MATRIX_GROUP']) - 1
          shard_count = int(os.environ['SHARD_COUNT'])
          out = Path(f"tmp/pr1400-fast-diagnostic/shard-{group + 1}")
          nodeids = [line.strip() for line in (out / 'all_nodeids.txt').read_text(encoding='utf-8').splitlines() if line.strip()]
          quarantine_paths = []
          q = Path('tests/ci/fast_quarantine.txt')
          if q.exists():
              for raw in q.read_text(encoding='utf-8').splitlines():
                  line = raw.strip()
                  if line and not line.startswith('#'):
                      quarantine_paths.append(line.split()[0])
          kept = [nodeid for nodeid in nodeids if not any(nodeid.startswith(path) for path in quarantine_paths)]
          shard = [nodeid for nodeid in kept if binascii.crc32(nodeid.encode()) % shard_count == group]
          (out / 'quarantine_paths.txt').write_text('\n'.join(quarantine_paths) + ('\n' if quarantine_paths else ''), encoding='utf-8')
          (out / 'kept_nodeids.txt').write_text('\n'.join(kept) + ('\n' if kept else ''), encoding='utf-8')
          (out / 'shard_nodeids.txt').write_text('\n'.join(shard) + ('\n' if shard else ''), encoding='utf-8')
          (out / 'selection_summary.txt').write_text(
              f'all_nodeids={len(nodeids)}\n'
              f'quarantine_paths={len(quarantine_paths)}\n'
              f'kept_nodeids={len(kept)}\n'
              f'shard={group + 1}/{shard_count}\n'
              f'shard_nodeids={len(shard)}\n',
              encoding='utf-8',
          )
          PY

          if [[ -s "$OUT/shard_nodeids.txt" ]]; then
            mapfile -t SHARD_IDS < "$OUT/shard_nodeids.txt"
            timeout 1200s .venv/bin/pytest \
              -m "$MARK" \
              "${SHARD_IDS[@]}" \
              --maxfail=3 \
              --tb=short \
              -rfE -q > "$OUT/fast_pytest.log" 2>&1
            rc=$?
          else
            echo "empty shard" > "$OUT/fast_pytest.log"
            rc=0
          fi

          printf 'fast_rc=%s\n' "$rc" > "$OUT/fast_summary.txt"
          grep -aE '^(FAILED|ERROR)' "$OUT/fast_pytest.log" > "$OUT/fast_failures.txt" || true
          tail -n 220 "$OUT/fast_pytest.log" > "$OUT/fast_tail.txt" || true
          cat "$OUT/selection_summary.txt"
          cat "$OUT/fast_summary.txt"
          cat "$OUT/fast_failures.txt" || true
          exit 0

      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: pr1400-fast-diagnostic-shard-${{ matrix.group }}
          path: tmp/pr1400-fast-diagnostic/shard-${{ matrix.group }}
          retention-days: 7
