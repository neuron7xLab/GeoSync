# SPDX-License-Identifier: MIT
name: CNS Release Gate

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/cns-release-gate.yml"
      - "conf/cns_program/**"
      - "tools/cns_program/**"
      - "docs/governance/CNS_RELEASE_GATE.md"
      - "reports/CNS_RELEASE_GATE_CONTRACT.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/cns-release-gate.yml"
      - "conf/cns_program/**"
      - "tools/cns_program/**"
      - "docs/governance/CNS_RELEASE_GATE.md"
      - "reports/CNS_RELEASE_GATE_CONTRACT.md"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONPATH: .

concurrency:
  group: cns-release-gate
  cancel-in-progress: true

jobs:
  cns-release-gate-python-311:
    name: cns-release-gate / python-3.11
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'

      - name: Install runtime dependency
        run: python -m pip install PyYAML

      - name: Run deterministic CNS release gate
        run: |
          python tools/cns_program/deploy_release_gate.py
          python tools/cns_program/build_release_manifest.py
          python tools/cns_program/verify_release_manifest.py
          python tools/cns_program/verify_reports_contract.py
          python tools/cns_program/quality_gate.py

  cns-release-gate-python-312:
    name: cns-release-gate / python-3.12
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'

      - name: Install runtime dependency
        run: python -m pip install PyYAML

      - name: Run deterministic CNS release gate
        run: |
          python tools/cns_program/deploy_release_gate.py
          python tools/cns_program/build_release_manifest.py
          python tools/cns_program/verify_release_manifest.py
          python tools/cns_program/verify_reports_contract.py
          python tools/cns_program/quality_gate.py
