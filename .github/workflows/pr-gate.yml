# SPDX-License-Identifier: MIT
#
# PR Gate: synchronous merge contract for main.
# Jobs are fail-closed and content-aware. Third-party actions must be pinned by
# full commit SHA; repo-policy enforces that invariant on every run.
name: PR Gate

on:
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  BBB_NVU_ARTIFACT_DIR: BBB_NVU_Cognitive_Noise_Gate_2026

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  repo-policy:
    name: repo-policy
    runs-on: ubuntu-latest
    continue-on-error: false
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate workflow policy invariants
        run: |
          set -euo pipefail
          for wf in .github/workflows/*.yml; do
            grep -Eq '^permissions:' "$wf" || { echo "ERROR: $wf missing permissions"; exit 1; }
            if grep -Eq '^\s*pull_request_target:' "$wf"; then
              echo "ERROR: $wf uses forbidden pull_request_target"
              exit 1
            fi
          done

      - name: Enforce pinned actions policy
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          pattern = re.compile(r'^\s*uses:\s*([^\s#]+)')
          violations = []
          for wf in sorted(Path('.github/workflows').glob('*.yml')):
              for lineno, line in enumerate(wf.read_text(encoding='utf-8').splitlines(), start=1):
                  m = pattern.search(line)
                  if not m:
                      continue
                  ref = m.group(1)
                  if ref.startswith('./') or ref.startswith('docker://'):
                      continue
                  if not re.search(r'@[a-f0-9]{40}$', ref):
                      violations.append(f"{wf}:{lineno}: unpinned action reference: {ref}")

          if violations:
              print('\n'.join(violations))
              raise SystemExit(1)
          print('Pinned action policy passed.')
          PY

      - name: Actionlint validation
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.8 -color

      - name: Inventory and manifest integrity checks
        run: |
          set -euo pipefail
          python scripts/ci/check_inventory_sync.py
          python scripts/ci/check_manifest_hashes.py

  constraints-lock-sync:
    name: constraints-lock-sync
    runs-on: ubuntu-latest
    continue-on-error: false
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'

      - name: Install minimal deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'PyYAML>=6.0.3' 'tomli>=2'

      - name: Detect relevant changes
        id: changed
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            base_ref="origin/${{ github.base_ref }}"
            changed_files=$(git diff --name-only "$base_ref...$GITHUB_SHA")
          else
            changed_files=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")
          fi
          if printf '%s\n' "$changed_files" | grep -Eq \
            '^(constraints/security\.txt|requirements(-dev|-scan)?\.lock)$'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No constraints/lock surface changed; D8 gate passes."
          fi

      - name: Fail-closed on constraint/lock divergence (D8)
        if: steps.changed.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          import sys

          out = subprocess.run(
              [sys.executable, "tools/deps/validate_dependency_truth.py"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout
          report = json.loads(out)
          d8 = [d for d in report["drifts"] if d["drift_class"] == "D8"]
          if d8:
              print("FAIL: constraint/lock divergence (D8): pip install will be ResolutionImpossible")
              for d in d8:
                  print(f"  [{d['priority']}] {d['package']}: {d['detail']}")
                  print(f"        fix: {d['fix']}")
              sys.exit(1)
          print("constraints/security.txt and requirements*.lock are in sync (no D8 drift).")
          PY

  python-quality:
    name: python-quality
    runs-on: ubuntu-latest
    continue-on-error: false
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Python environment
        uses: ./.github/actions/setup-geosync
        with:
          python-version: '3.11'
          cache-prefix: pr-quality

      - name: Verify pip executable and Python contract
        run: |
          set -euo pipefail
          .venv/bin/python -m pip --version
          .venv/bin/python -m pip check
          .venv/bin/python - <<'PY'
          import tomllib
          from pathlib import Path

          requires = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['requires-python']
          if requires != '>=3.11,<3.13':
              raise SystemExit(f'Unexpected requires-python: {requires}')
          print(f'requires-python validated: {requires}')
          PY

      - name: Collect changed Python files
        id: changed-python
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            base_ref="origin/${{ github.base_ref }}"
            changed_files=$(git diff --name-only "$base_ref...$GITHUB_SHA")
          else
            changed_files=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")
          fi

          mapfile -t py_files < <(
            printf '%s\n' "$changed_files" \
            | awk '/\.py$/' \
            | while IFS= read -r f; do
                [[ -f "$f" ]] && printf '%s\n' "$f"
              done
          )
          printf '%s\n' "${py_files[@]}" > /tmp/changed-python-files.txt
          echo "count=${#py_files[@]}" >> "$GITHUB_OUTPUT"
          if [[ ${#py_files[@]} -eq 0 ]]; then
            echo "No Python file changes detected; python-quality passes."
          else
            echo "Changed Python files:"
            cat /tmp/changed-python-files.txt
          fi

      - name: Ruff on changed Python files
        if: steps.changed-python.outputs.count != '0'
        run: |
          set -euo pipefail
          mapfile -t py_files < /tmp/changed-python-files.txt
          .venv/bin/ruff check "${py_files[@]}"

      - name: Black check on changed Python files
        if: steps.changed-python.outputs.count != '0'
        run: |
          set -euo pipefail
          mapfile -t py_files < /tmp/changed-python-files.txt
          .venv/bin/black --check "${py_files[@]}"

      - name: Mypy on changed Python files
        if: steps.changed-python.outputs.count != '0'
        run: |
          set -euo pipefail
          mapfile -t py_files < /tmp/changed-python-files.txt
          .venv/bin/mypy "${py_files[@]}"

  bbb-nvu-artifact-verifier:
    name: bbb-nvu-artifact-verifier
    runs-on: ubuntu-latest
    needs: python-quality
    continue-on-error: false
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Python environment
        uses: ./.github/actions/setup-geosync
        with:
          python-version: '3.11'
          cache-prefix: pr-bbb-nvu

      - name: Detect BBB-NVU artifact changes
        id: bbb-nvu-changes
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            base_ref="origin/${{ github.base_ref }}"
            changed_files=$(git diff --name-only "$base_ref...$GITHUB_SHA")
          else
            changed_files=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")
          fi
          printf '%s\n' "$changed_files" > /tmp/changed-files.txt
          if grep -Eq '^BBB_NVU_Cognitive_Noise_Gate_2026/(src|tests|scripts|tools)/' /tmp/changed-files.txt \
            || grep -Eq '^BBB_NVU_Cognitive_Noise_Gate_2026/(config|schemas|examples)/' /tmp/changed-files.txt \
            || grep -Eq '^BBB_NVU_Cognitive_Noise_Gate_2026/invariants\.yaml$' /tmp/changed-files.txt \
            || grep -Eq '^\.github/workflows/pr-gate\.yml$' /tmp/changed-files.txt; then
            echo "applicable=true" >> "$GITHUB_OUTPUT"
          else
            echo "applicable=false" >> "$GITHUB_OUTPUT"
            echo "No BBB-NVU executable or contract surface changed; verifier gate passes."
          fi

      - name: Run BBB-NVU one-command verifier
        if: steps.bbb-nvu-changes.outputs.applicable == 'true'
        run: |
          set -euo pipefail
          .venv/bin/python BBB_NVU_Cognitive_Noise_Gate_2026/tools/verify_artifact.py

  python-fast-shard:
    name: python-fast-shard
    runs-on: ubuntu-latest
    needs: python-quality
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Python environment
        uses: ./.github/actions/setup-geosync
        with:
          python-version: '3.11'
          cache-prefix: pr-fast-tests

      - name: Verify pip executable
        run: .venv/bin/python -m pip --version

      - name: Verify test-level classification (fail-fast)
        run: |
          set -euo pipefail
          [[ -x .venv/bin/pytest ]] || { echo ".venv/bin/pytest missing"; exit 1; }
          .venv/bin/pytest --collect-only -q \
            tests/connectors/test_fail_closed_connectors.py \
            tests/connectors/test_polygon_adapter_reproducible.py \
            scripts/tests/test_generate_stakeholder_assets.py

      - name: Run fast deterministic pytest gate
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            base_ref="origin/${{ github.base_ref }}"
            changed_files=$(git diff --name-only "$base_ref...$GITHUB_SHA")
          else
            changed_files=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")
          fi

          if ! printf '%s\n' "$changed_files" | awk '
            /^tests\// || /^core\// || /^backtest\// || /^execution\// || /^src\// ||
            /^scripts\// || /^BBB_NVU_Cognitive_Noise_Gate_2026\/(src|tests|scripts|tools)\// ||
            /^pyproject\.toml$/ || /^requirements(-dev)?\.(txt|lock)$/ ||
            /^pytest\.ini$/ || /^\.github\/workflows\/pr-gate\.yml$/ || /^\.pre-commit-config\.yaml$/ {
              found=1; exit
            }
            END { exit !found }
          '; then
            echo "No Python runtime/test surface changes detected; shard passes."
            exit 0
          fi

          [[ -x .venv/bin/pytest ]] || { echo ".venv/bin/pytest missing"; exit 1; }
          export PYTHONUTF8=1
          export PYTHONIOENCODING=utf-8
          MARK="not slow and not heavy_math and not nightly and not flaky"
          TEST_ROOTS=(tests)
          if [[ -d BBB_NVU_Cognitive_Noise_Gate_2026/tests ]]; then
            TEST_ROOTS+=(BBB_NVU_Cognitive_Noise_Gate_2026/tests)
          fi
          .venv/bin/pytest "${TEST_ROOTS[@]}" -m "$MARK" --collect-only -q 2>/dev/null \
            | grep -E '::' > /tmp/all_nodeids.txt || true
          .venv/bin/python -c "import binascii,pathlib; ids=[l.strip() for l in pathlib.Path('/tmp/all_nodeids.txt').read_text().splitlines() if l.strip()]; g=${{ matrix.group }}-1; sh=[n for n in ids if binascii.crc32(n.encode())%4==g]; pathlib.Path('/tmp/shard_nodeids.txt').write_text(chr(10).join(sh)); print(f'shard {g+1}/4: {len(sh)}/{len(ids)} selected tests')"
          if [[ ! -s /tmp/shard_nodeids.txt ]]; then
            echo "empty shard (no selected tests) — shard passes"; exit 0
          fi
          mapfile -t SHARD_IDS < /tmp/shard_nodeids.txt
          timeout 1200s .venv/bin/pytest \
            -m "$MARK" \
            "${SHARD_IDS[@]}" \
            --maxfail=1 \
            -q

      - name: Run mandatory connector hygiene tests
        run: |
          set -euo pipefail
          [[ -x .venv/bin/pytest ]] || { echo ".venv/bin/pytest missing"; exit 1; }
          timeout 300s .venv/bin/pytest \
            tests/connectors/test_fail_closed_connectors.py \
            tests/connectors/test_polygon_adapter_reproducible.py \
            scripts/tests/test_generate_stakeholder_assets.py \
            --maxfail=1 \
            -q

      - name: Run formal verification gate
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            base_ref="origin/${{ github.base_ref }}"
            changed_files=$(git diff --name-only "$base_ref...$GITHUB_SHA")
          else
            changed_files=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")
          fi

          if ! printf '%s\n' "$changed_files" | awk '
            /^formal\// || /^cortex_service\// || /^src\// || /^tests\// ||
            /^BBB_NVU_Cognitive_Noise_Gate_2026\/(src|tests|tools)\// ||
            /^Makefile$/ || /^requirements(-dev)?\.(txt|lock)$/ {
              found=1; exit
            }
            END { exit !found }
          '; then
            echo "No formal-sensitive changes detected; skipping formal-verify."
            exit 0
          fi

          make formal-verify

  python-fast-tests:
    name: python-fast-tests
    runs-on: ubuntu-latest
    needs:
      - python-fast-shard
      - bbb-nvu-artifact-verifier
    continue-on-error: false
    timeout-minutes: 5
    steps:
      - name: All fast and artifact gates green
        run: echo "python-fast-shard matrix and BBB-NVU verifier green — fast gate satisfied"

  python-heavy-tests:
    name: python-heavy-tests
    runs-on: ubuntu-latest
    needs: python-fast-tests
    continue-on-error: false
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Python environment
        uses: ./.github/actions/setup-geosync
        with:
          python-version: '3.11'
          cache-prefix: pr-heavy-tests

      - name: Run heavy invariant gate
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            base_ref="origin/${{ github.base_ref }}"
            changed_files=$(git diff --name-only "$base_ref...$GITHUB_SHA")
          else
            changed_files=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")
          fi

          if ! printf '%s\n' "$changed_files" | awk '
            /^formal\// || /^cortex_service\// || /^src\// || /^tests\// ||
            /^scripts\// || /^BBB_NVU_Cognitive_Noise_Gate_2026\/(src|tests|scripts|tools)\// ||
            /^Makefile$/ || /^core\// {
              found=1; exit
            }
            END { exit !found }
          '; then
            echo "No heavy-test-sensitive changes detected; skipping test-heavy."
            exit 0
          fi
