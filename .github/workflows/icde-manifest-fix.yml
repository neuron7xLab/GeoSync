name: ICDE Manifest Fix

on:
  push:
    branches:
      - coverage_ascent_9297_work_act

permissions:
  contents: write

jobs:
  regenerate-manifest:
    if: github.actor == 'neuron7xLab'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coverage_ascent_9297_work_act
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove temporary workflow and regenerate manifest
        run: |
          set -euo pipefail
          git rm -f .github/workflows/icde-manifest-fix.yml
          python scripts/ci/generate_manifest.py
          python scripts/ci/generate_manifest.py --check
          grep -F './reports/COVERAGE_ASCENT_92_97_WORK_ACT.md' MANIFEST.sha256
          grep -F './.claude/commit_acceptors/coverage-ascent-9297-work-act.yaml' MANIFEST.sha256
      - name: Commit manifest fix
        run: |
          set -euo pipefail
          git config user.name 'neuron7xLab'
          git config user.email '226363063+neuron7xLab@users.noreply.github.com'
          git add MANIFEST.sha256 .github/workflows/icde-manifest-fix.yml
          git diff --cached --name-only
          git commit -m 'chore(ci): refresh manifest for coverage ascent work act'
          git push origin HEAD:coverage_ascent_9297_work_act
