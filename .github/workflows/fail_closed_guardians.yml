name: Fail-Closed Guardians

on:
  pull_request:
  push:
    branches: [main]

jobs:
  guardian-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal test deps
        run: python -m pip install --upgrade pip pytest pyyaml jsonschema
      - name: Epistemic drift (fail-closed)
        run: python scripts/check_epistemic_drift.py
      - name: Financial contract validator
        run: python scripts/validate_financial_contract.py
      - name: Regenerate claim graph
        run: python scripts/generate_claim_graph.py
      - name: Claims lifecycle guard
        run: python scripts/claims_lifecycle.py
      - name: Verify claim hashes
        run: python scripts/verify_claim_hashes.py
      - name: Purity and runtime guard tests
        run: >-
          pytest -q
          tests/tools/test_execution_purity.py
          tests/tools/test_runtime_cost_profiler.py
          tests/tools/test_check_epistemic_drift.py
          tests/adversarial_invariants/test_invariant_fail_closed.py
