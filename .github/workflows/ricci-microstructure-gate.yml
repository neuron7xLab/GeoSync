name: Ricci Microstructure Gate

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
    paths:
      - "geosync_research/**"
      - "tools/research/research_cli.py"
      - "tests/research_lines/test_ricci_microstructure_v1.py"
      - "schemas/research/ricci_microstructure_artifact.schema.json"
      - "configs/research/ricci_microstructure_v1.json"
      - "data/l2_manifest.json"
      - "data/raw/binance_btcusdt_depth10.csv"
      - ".github/workflows/ricci-microstructure-gate.yml"
  push:
    branches: [main]
    paths:
      - "geosync_research/**"
      - "tools/research/research_cli.py"
      - ".github/workflows/ricci-microstructure-gate.yml"

permissions:
  contents: read

jobs:
  lane-gate:
    name: ricci-microstructure-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock || pip install -r requirements.txt
          pip install -r requirements-dev.lock || pip install -r requirements-dev.txt
      - name: Quality (ruff + mypy --strict)
        run: |
          python -m ruff check geosync_research tools/research/research_cli.py
          python -m mypy --strict geosync_research/lines/ricci_microstructure_v1
      - name: Lane tests
        run: PYTHONPATH=. python -m pytest -q tests/research_lines/test_ricci_microstructure_v1.py
      - name: Ingest committed frozen data (fast, no network)
        run: |
          PYTHONPATH=. python -m tools.research.research_cli ingest \
            --data data/l2_manifest.json --out data/processed/ricci_microstructure_v1
      - name: Verify committed artifact + SHA integrity (fast; full 1000-surrogate run is the capsule)
        run: |
          PYTHONPATH=. python - <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          run = next(Path("artifacts/runs/ricci_microstructure_v1").glob("ricci_microstructure_v1_*"))
          art = json.loads((run / "artifact.json").read_text())
          forbidden = {"ALPHA_FOUND", "MARKET_SIGNAL_PROVEN", "PRODUCTION_READY", "PHYSICS_CONFIRMED"}
          assert art["falsification_status"] in {"SUPPORTED", "HYPOTHESIS_NOT_SUPPORTED", "INVALID"}, art["falsification_status"]
          assert art["falsification_status"] not in forbidden
          assert art["forbidden_claims_absent"] is True, "forbidden_claims_absent must be true"
          assert art["dirty_git"] is False, "artifact must be generated on a clean tree"
          assert art["claim_tier"].startswith("T3"), art["claim_tier"]
          allowed_sources = {"LOBSTER_LICENSED_L2", "BINANCE_FUTURES_DEPTH"}
          assert art["source"] in allowed_sources, f"relabelled/unknown source: {art['source']}"
          raw = Path("data/raw/binance_btcusdt_depth10.csv")
          actual = hashlib.sha256(raw.read_bytes()).hexdigest()
          ingested = json.loads(Path("data/processed/ricci_microstructure_v1/data_manifest.json").read_text())
          # honest source: a Binance file must never be relabelled LOBSTER
          assert ingested["source"] == art["source"], "manifest/artifact source mismatch"
          assert not (art["source"].startswith("LOBSTER") and "binance" in raw.name.lower()), "Binance data relabelled as LOBSTER"
          assert actual == ingested["data_sha256"] == art["data_sha256"], "committed artifact does not match committed data"
          print("verified:", art["run_id"], art["falsification_status"], "source", ingested["source"])
          PY
          PYTHONPATH=. python -m tools.research.research_cli verify \
            "$(ls -d artifacts/runs/ricci_microstructure_v1/ricci_microstructure_v1_*/artifact.json | head -1)"
      - name: Upload evidence bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ricci-microstructure-evidence
          path: artifacts/runs/ricci_microstructure_v1/**/evidence_bundle*
          if-no-files-found: warn

  supply-chain:
    name: ricci-supply-chain
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lane-gate
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: SBOM (Syft, CycloneDX)
        uses: anchore/sbom-action@e11c554f704a0b820cbf8c51673f6945e0731532 # v0.20.0
        with:
          path: geosync_research/lines/ricci_microstructure_v1
          format: cyclonedx-json
          output-file: sbom/ricci-cdx.json
      - name: CVE scan (Grype, fail on High/Critical)
        uses: anchore/scan-action@2c901ab7378897c01b8efaa2d0c9bf519cc64b9e # v6.0.0
        with:
          sbom: sbom/ricci-cdx.json
          severity-cutoff: high
          fail-build: true
      - name: SLSA build provenance attestation
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: sbom/ricci-cdx.json
