# SPDX-License-Identifier: MIT
name: Readiness Gate

on:
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  readiness-register:
    name: readiness-register
    runs-on: ubuntu-latest
    continue-on-error: false
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install test runner
        run: |
          set -euo pipefail
          python -m pip install --user pytest

      - name: Check readiness register
        run: |
          set -euo pipefail
          python tools/check_readiness_register.py

      - name: Test readiness register contract
        run: |
          set -euo pipefail
          python -m pytest -q tests/governance/test_readiness_register.py
