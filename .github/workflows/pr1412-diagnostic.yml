# SPDX-License-Identifier: MIT
name: PR 1412 Diagnostic Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pr1412-diagnostic.yml'
      - 'tests/ci/fast_quarantine.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr1412-diagnostic-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  diagnostic:
    name: pr1412-diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'

      - name: Install diagnostic dependencies
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install pytest hypothesis pyyaml mypy ruff black "POT>=0.9.5" "pyarrow>=15.0.0" "typer>=0.20.0,<1.0.0"

      - name: Execute fast-lane diagnostic
        run: |
          set +e
          mkdir -p tmp/pr1412-diagnostic
          MARK="not slow and not heavy_math and not nightly and not flaky"
          .venv/bin/pytest tests/ -m "$MARK" --collect-only \
            | grep -E '^tests/.*::' > tmp/pr1412-diagnostic/all_nodeids.txt
          collect_rc=${PIPESTATUS[0]}
          grep -vE '^\s*#|^\s*$' tests/ci/fast_quarantine.txt \
            | awk '{print $1}' > tmp/pr1412-diagnostic/quarantine_paths.txt || true
          grep -vFf tmp/pr1412-diagnostic/quarantine_paths.txt \
            tmp/pr1412-diagnostic/all_nodeids.txt \
            > tmp/pr1412-diagnostic/all_nodeids.kept || true
          echo "collect_rc=${collect_rc}" | tee tmp/pr1412-diagnostic/fast_summary.txt
          echo "all_nodeids=$(wc -l < tmp/pr1412-diagnostic/all_nodeids.txt | tr -d ' ')" | tee -a tmp/pr1412-diagnostic/fast_summary.txt
          echo "kept_nodeids=$(wc -l < tmp/pr1412-diagnostic/all_nodeids.kept | tr -d ' ')" | tee -a tmp/pr1412-diagnostic/fast_summary.txt
          .venv/bin/pytest -m "$MARK" \
            $(cat tmp/pr1412-diagnostic/all_nodeids.kept) \
            --maxfail=20 -rA -q \
            > tmp/pr1412-diagnostic/fast_pytest.log 2>&1
          fast_rc=$?
          echo "fast_rc=${fast_rc}" | tee -a tmp/pr1412-diagnostic/fast_summary.txt
          grep -aE '^(FAILED|ERROR)' tmp/pr1412-diagnostic/fast_pytest.log \
            > tmp/pr1412-diagnostic/fast_failures.txt || true
          tail -n 200 tmp/pr1412-diagnostic/fast_pytest.log \
            > tmp/pr1412-diagnostic/fast_tail.txt || true
          exit 0

      - name: Execute research diagnostic
        run: |
          set +e
          mkdir -p tmp/pr1412-diagnostic
          .venv/bin/python -m pytest tests/ci tests/research_lines -q --maxfail=5 -rA \
            > tmp/pr1412-diagnostic/research_pytest.log 2>&1
          research_rc=$?
          echo "research_rc=${research_rc}" | tee tmp/pr1412-diagnostic/research_summary.txt
          grep -aE '^(FAILED|ERROR)' tmp/pr1412-diagnostic/research_pytest.log \
            > tmp/pr1412-diagnostic/research_failures.txt || true
          tail -n 200 tmp/pr1412-diagnostic/research_pytest.log \
            > tmp/pr1412-diagnostic/research_tail.txt || true
          exit 0

      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: pr1412-diagnostic-evidence
          path: tmp/pr1412-diagnostic
          retention-days: 14
