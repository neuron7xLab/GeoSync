# SPDX-License-Identifier: MIT
name: Repo Integrity Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'README.md'
      - 'PRODUCT_CATEGORY.md'
      - 'CLAIMS.md'
      - 'FORBIDDEN_CLAIMS.md'
      - 'AGENTS.md'
      - 'BASELINE.md'
      - 'docs/**/*.md'
      - 'examples/**/*.json'
      - 'scripts/ci/prove_repo_integrity.sh'
      - 'scripts/ci/check_research_artifact_truth.py'
      - 'scripts/ci/check_claim_artifact_graph.py'
      - 'scripts/ci/check_manifest_hashes.py'
      - 'scripts/reproduce/mfn_capsule.py'
      - 'artifacts/reproducible_capsules/**'
      - 'scripts/ci/check_claim_boundary.py'
      - 'scripts/check_python_matrix.py'
      - 'scripts/check_namespace_policy.py'
      - 'scripts/count_invariants.py'
      - 'schemas/research/**'
      - 'schemas/autonomy_cycle.schema.json'
      - 'research_lines/**'
      - 'artifacts/runs/**'
      - 'tools/research/**'
      - 'tools/mfn_surface_check.py'
      - 'tools/patch_makefile_geosync_coverage.py'
      - 'tools/validate_json_artifact_contract.py'
      - 'tools/check_json_contract_evidence_policy.py'
      - 'tools/json_contract_receipt.py'
      - 'tools/run_autonomy_cycle.py'
      - 'tests/ci/**'
      - 'tests/research_lines/**'
      - '.github/workflows/repo-integrity-gate.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-integrity-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-integrity-gate:
    name: repo-integrity-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'

      - name: Install sci-core stack
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas networkx pyyaml jsonschema pytest

      - name: Prove repository integrity
        run: bash scripts/ci/prove_repo_integrity.sh
